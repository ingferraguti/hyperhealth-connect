schemaVersion: 1
repositoryPolicy: hhc-enterprise
defaultBranch: main
enforcement: active
operatingMode: solo-maintainer-bootstrap
rules:
  pullRequestRequired: true
  requiredApprovals: 0
  dismissStaleApprovals: true
  requireCodeOwnerReview: false
  requireLastPushApproval: false
  requireConversationResolution: true
  requireSignedCommits: false
  requireLinearHistory: true
  allowForcePushes: false
  allowDeletions: false
  bypass:
    allowed: false
  requiredChecks:
    strict: true
    names:
      - phase0-gate
      - build-and-test
      - security-analysis
      - supply-chain
      - phase1-mobilization-gate
  protectedFiles:
    - .github/workflows/**
    - .github/CODEOWNERS
    - .github/branch-protection.yml
    - pom.xml
    - docs/adr/**
promotionToTeamMode:
  trigger: at-least-two-independent-qualified-reviewers-available
  changes:
    requiredApprovals: 2
    requireCodeOwnerReview: true
    requireLastPushApproval: true
    requireSignedCommits: true
  evidence:
    - collaborator-access-review
    - codeowners-coverage-review
    - successful-protected-pull-request
