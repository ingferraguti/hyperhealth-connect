invariants:
  - id: ISO-01
    statement: Every public repository, service and Endpoint API operation receives VerifiedFacilityScope first.
  - id: ISO-02
    statement: Scope comes only from a validated signed identity; client scope headers are never authoritative.
  - id: ISO-03
    statement: Every Endpoint SQL predicate includes tenant_id and facility_id before the resource identifier.
  - id: ISO-04
    statement: A foreign object and an absent object have the same non-enumerable API outcome.
  - id: ISO-05
    statement: A denied mutation commits no endpoint, identity, idempotency claim, binding or target-scope audit row.
  - id: ISO-06
    statement: Audit of a scoped read denial is written only to the requester scope and stores no raw target identifier.
  - id: ISO-07
    statement: No inventory cache exists; introducing one fails the gate until its key contains tenant and facility and its negative matrix is added.

