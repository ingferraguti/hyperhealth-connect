qualificationBoundary:
  included:
    - unicode-code-point-validation
    - exact-unicode-sequence-preservation
    - utf8-json-and-postgresql-round-trip
    - locale-independent-identifiers-and-enums
    - timezone-independent-persisted-instants
    - dst-overlap
    - idempotency-and-audit-timestamps
  excluded:
    - clinical-payload-and-patient-identifiers
    - locale-aware-search-and-collation
    - source-timezone-preservation-for-clinical-events
    - terminology-display-language-negotiation
  exclusionRationale: >-
    P1-0109 qualifies the implemented Endpoint inventory vertical slice. Clinical payloads,
    patient identifiers, terminology and source-zone semantics belong to later ingestion and
    semantic work packages and are not falsely certified here.

invariants:
  - id: I18N-01
    statement: Accepted display names are well-formed Unicode and are limited by code points, not UTF-16 code units.
  - id: I18N-02
    statement: The accepted Unicode sequence is preserved exactly; no implicit NFC, NFD or compatibility normalization occurs.
  - id: I18N-03
    statement: Boundary whitespace is removed by the documented API policy while internal Unicode whitespace is preserved.
  - id: I18N-04
    statement: JSON and PostgreSQL transport accepted strings as UTF-8 without byte or code-point loss.
  - id: I18N-05
    statement: Technical identifiers are canonical ASCII prefix plus lowercase UUID and are rejected, never rewritten, when non-canonical.
  - id: I18N-06
    statement: Identifier parsing and lifecycle enums are independent from JVM default locale and HTTP Accept-Language.
  - id: I18N-07
    statement: Every domain instant is persisted as PostgreSQL timestamptz and compared as an Instant.
  - id: I18N-08
    statement: Session timezone and a DST overlap can change rendering only, never the represented instant, expiry or audit chain.

