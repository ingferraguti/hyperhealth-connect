schemaVersion: 1
activity: P1-0110
baselineDate: 2026-09-17
status: implemented
classification: synthetic-only
seed:
  path: platform/control-plane/src/test/resources/seed/p1-0110-inventory-scale.sql
  sha256: be23be4b27e095ad2bd6d74efb01a507996857172aa3ca9c17dce4a8166df131
  deterministic: true
  atomic: true
  marker: HHC-SYNTHETIC
  generator: PostgreSQL-generate_series
  cardinality:
    tenants: 2
    organizations: 2
    facilities: 4
    applications: 8
    endpoints: 12000
    runtimeCells: 2
    runtimeCellFacilityAssignments: 4
  lifecycleDistribution:
    activeEndpoints: 10800
    suspendedEndpoints: 1200
    decommissionedEndpoints: 0
  scopeDistribution:
    - {tenant: alpha, facility: alpha-one, endpoints: 6000, hotScope: true}
    - {tenant: alpha, facility: alpha-two, endpoints: 2000, hotScope: false}
    - {tenant: beta, facility: beta-one, endpoints: 2000, hotScope: false}
    - {tenant: beta, facility: beta-two, endpoints: 2000, hotScope: false}

environment:
  profile: developer-testcontainers-non-qualifying
  postgresImage: postgres:18.6-bookworm
  postgresDigest: sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
  migrationSet: V001-V007
  statisticsPreparation: VACUUM-ANALYZE-endpoint
  productionCapacityClaim: false

invariants:
  - id: SCALE-01
    statement: Every seeded display name is visibly marked HHC-SYNTHETIC and derives from no real person or production system.
  - id: SCALE-02
    statement: The entire hierarchy and runtime-cell assignment set commits atomically with all database constraints enabled.
  - id: SCALE-03
    statement: Every Endpoint has a permanent resource identity and valid Tenant, Facility and Application ancestry.
  - id: SCALE-04
    statement: The hot Facility contains 50 percent of the corpus while every other Facility remains populated.
  - id: SCALE-05
    statement: Facility-scoped keyset pagination returns every visible Endpoint exactly once in pages bounded to 100.
  - id: SCALE-06
    statement: Every repository page append remains in the requesting Facility audit chain and the chain verifies.
  - id: SCALE-07
    statement: Cold-scope Facility and Application plans use their dedicated partial covering indexes and no sequential Endpoint scan.
  - id: SCALE-08
    statement: The warm developer regression sample has at least 100 observations and p95 at or below 500 ms.
  - id: SCALE-09
    statement: Developer latency is regression evidence only and cannot be represented as production capacity, HA, BC or DR qualification.

automatedChecks:
  - {id: TOPOLOGY-CARDINALITY, layer: postgresql, oracle: exact-counts, automatedBy: InventoryScaleQualificationTest.loadsDeterministicSyntheticEnterpriseTopologyAndHotScope}
  - {id: SYNTHETIC-MARKER, layer: data-governance, oracle: zero-unmarked-display-names, automatedBy: InventoryScaleQualificationTest.loadsDeterministicSyntheticEnterpriseTopologyAndHotScope}
  - {id: ENDPOINT-IDENTITY-LEDGER, layer: postgresql, oracle: one-identity-per-endpoint, automatedBy: InventoryScaleQualificationTest.loadsDeterministicSyntheticEnterpriseTopologyAndHotScope}
  - {id: ENDPOINT-ANCESTRY, layer: postgresql, oracle: complete-valid-join, automatedBy: InventoryScaleQualificationTest.loadsDeterministicSyntheticEnterpriseTopologyAndHotScope}
  - {id: LIFECYCLE-DISTRIBUTION, layer: postgresql, oracle: 10800-active-1200-suspended, automatedBy: InventoryScaleQualificationTest.loadsDeterministicSyntheticEnterpriseTopologyAndHotScope}
  - {id: HOT-SCOPE, layer: postgresql, oracle: 6000-endpoints, automatedBy: InventoryScaleQualificationTest.loadsDeterministicSyntheticEnterpriseTopologyAndHotScope}
  - {id: KEYSET-COMPLETE, layer: repository, oracle: 6000-unique-in-60-pages, automatedBy: InventoryScaleQualificationTest.paginatesTheHotFacilityExactlyOnceWithBoundedKeysetPagesAndScopedAudit}
  - {id: PAGE-BOUND, layer: repository, oracle: maximum-100, automatedBy: InventoryScaleQualificationTest.paginatesTheHotFacilityExactlyOnceWithBoundedKeysetPagesAndScopedAudit}
  - {id: AUDIT-SCOPE, layer: audit, oracle: 60-scoped-events-valid-chain, automatedBy: InventoryScaleQualificationTest.paginatesTheHotFacilityExactlyOnceWithBoundedKeysetPagesAndScopedAudit}
  - {id: FACILITY-PLAN, layer: postgresql, oracle: ix_endpoint_facility_page_active, automatedBy: InventoryScaleQualificationTest.qualifiesScopedCoveringPlansAndPublishesNonProductionLatencyEvidence}
  - {id: APPLICATION-PLAN, layer: postgresql, oracle: ix_endpoint_facility_application_page_active, automatedBy: InventoryScaleQualificationTest.qualifiesScopedCoveringPlansAndPublishesNonProductionLatencyEvidence}
  - {id: WARM-P95, layer: jdbc, oracle: p95-lte-500ms-100-samples, automatedBy: InventoryScaleQualificationTest.qualifiesScopedCoveringPlansAndPublishesNonProductionLatencyEvidence}

qualificationBoundary:
  included:
    - deterministic-scale-corpus
    - schema-and-ancestry-integrity
    - hot-facility-keyset-pagination
    - scoped-audit-chain
    - read-plan-index-selection
    - developer-regression-latency
  excluded:
    - production-capacity
    - distributed-load-generation
    - concurrent-writer-saturation
    - multi-replica-failover
    - backup-restore-and-disaster-recovery
    - customer-sizing
    - full-audit-retention-scale
  exclusionRationale: >-
    P1-0110 closes the seed and indexed-query activity in WP1-01. Production capacity,
    HA, BC/DR and customer sizing require the pinned qualification environment and the
    independent performance/recovery campaigns of WP1-11 and WP1-12.

execution:
  command: ./mvnw -B -ntp -pl platform/control-plane -am -Dtest=InventoryScaleQualificationTest -Dsurefire.failIfNoSpecifiedTests=false test
  gate: ./scripts/phase1-p1-0110-gate.ps1
  evidence:
    - platform/control-plane/target/phase1-p1-0110-evidence/inventory-scale-test-report.json
    - platform/control-plane/target/surefire-reports/TEST-io.hyperhealth.connect.controlplane.inventory.InventoryScaleQualificationTest.xml
