spring:
  application:
    name: hhc-control-plane
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
server:
  shutdown: graceful

hhc:
  security:
    oidc:
      enabled: ${HHC_OIDC_ENABLED:false}
      issuer-uri: ${HHC_OIDC_ISSUER_URI:}
      jwk-set-uri: ${HHC_OIDC_JWK_SET_URI:}
      jwk-connect-timeout: ${HHC_OIDC_JWK_CONNECT_TIMEOUT:2s}
      jwk-read-timeout: ${HHC_OIDC_JWK_READ_TIMEOUT:2s}
      human:
        audience: ${HHC_OIDC_HUMAN_AUDIENCE:hhc-control-plane-human}
        authorized-parties: ${HHC_OIDC_HUMAN_AUTHORIZED_PARTIES:hhc-control-plane-ui}
        max-token-lifetime: ${HHC_OIDC_HUMAN_MAX_TOKEN_LIFETIME:10m}
      workload:
        audience: ${HHC_OIDC_WORKLOAD_AUDIENCE:hhc-control-plane-workload}
        authorized-parties: ${HHC_OIDC_WORKLOAD_AUTHORIZED_PARTIES:hhc-runtime-agent}
        max-token-lifetime: ${HHC_OIDC_WORKLOAD_MAX_TOKEN_LIFETIME:5m}
  inventory:
    enabled: ${HHC_INVENTORY_ENABLED:false}
  inventory-api:
    cursor-signing-key: ${HHC_INVENTORY_CURSOR_SIGNING_KEY:}
    cursor-ttl: ${HHC_INVENTORY_CURSOR_TTL:15m}
    idempotency-retention: ${HHC_INVENTORY_IDEMPOTENCY_RETENTION:24h}
  platform-database:
    jdbc-url: ${HHC_PLATFORM_DB_JDBC_URL:}
    username: ${HHC_PLATFORM_DB_USERNAME:}
    password: ${HHC_PLATFORM_DB_PASSWORD:}
    maximum-pool-size: ${HHC_PLATFORM_DB_MAXIMUM_POOL_SIZE:20}
    minimum-idle: ${HHC_PLATFORM_DB_MINIMUM_IDLE:2}
    connection-timeout: ${HHC_PLATFORM_DB_CONNECTION_TIMEOUT:5s}
    validation-timeout: ${HHC_PLATFORM_DB_VALIDATION_TIMEOUT:2s}
    max-lifetime: ${HHC_PLATFORM_DB_MAX_LIFETIME:30m}
    keepalive-time: ${HHC_PLATFORM_DB_KEEPALIVE_TIME:5m}
