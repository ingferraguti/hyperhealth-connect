name: Phase 0 engineering gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

jobs:
  phase0-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repository policy and traceability gates
        shell: pwsh
        run: ./scripts/phase0-gate.ps1 -SkipBuild -SkipEnvironment

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21.0.11+10'
          cache: maven
      - name: Test, SAST and CycloneDX SBOM
        run: ./mvnw -B -ntp clean verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase0-build
          if-no-files-found: error
          retention-days: 14
          path: |
            target/hhc-phase0-sbom.json
            platform/control-plane/target/control-plane-*.jar
            runtime/worker/target/runtime-worker-*.jar
            **/target/surefire-reports/*.xml
            **/target/spotbugsXml.xml

  security-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: java-kotlin
          build-mode: manual
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21.0.11+10'
          cache: maven
      - run: ./mvnw -B -ntp -DskipTests compile
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  supply-chain:
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21.0.11+10'
          cache: maven
      - run: ./mvnw -B -ntp package cyclonedx:makeAggregateBom -DskipTests
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless signing of protected-branch artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cosign sign-blob --yes --bundle control-plane.sigstore.json platform/control-plane/target/control-plane-0.1.0-SNAPSHOT.jar
          cosign verify-blob --bundle control-plane.sigstore.json --certificate-identity-regexp '^https://github.com/.+/.github/workflows/phase0.yml@refs/heads/main$' --certificate-oidc-issuer https://token.actions.githubusercontent.com platform/control-plane/target/control-plane-0.1.0-SNAPSHOT.jar
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          subject-path: |
            platform/control-plane/target/control-plane-0.1.0-SNAPSHOT.jar
            runtime/worker/target/runtime-worker-0.1.0-SNAPSHOT.jar
            target/hhc-phase0-sbom.json

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later

