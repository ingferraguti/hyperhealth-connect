name: hhc-phase0
services:
  postgres:
    image: postgres:18.0-bookworm@sha256:3f55f8895c4ed50603e2fbdfc72fffeeaba3173321fee5cb825bbbeb30d9d854
    environment:
      POSTGRES_DB: hhc_control
      POSTGRES_USER: hhc_control
      POSTGRES_PASSWORD: ${HHC_POSTGRES_PASSWORD:?set HHC_POSTGRES_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U hhc_control -d hhc_control]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [control]
    volumes: [postgres-data:/var/lib/postgresql]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.0@sha256:bff074a5d0051dbc0bbbcd25b045bb1fe84833ec0d3c7c965d1797dd289ec88f
    environment:
      CLUSTER_ID: ${HHC_KAFKA_CLUSTER_ID:?set HHC_KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks: [data]
    volumes: [kafka-data:/var/lib/kafka/data]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  control-plane:
    build:
      context: ../..
      dockerfile: platform/control-plane/Dockerfile
    image: hhc/control-plane:0.1.0-phase0
    depends_on:
      postgres:
        condition: service_healthy
    ports: [127.0.0.1:18080:8080]
    networks: [control]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  runtime-worker:
    build:
      context: ../..
      dockerfile: runtime/worker/Dockerfile
    image: hhc/runtime-worker:0.1.0-phase0
    depends_on: [kafka]
    ports: [127.0.0.1:18081:8081]
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  control:
    internal: true
  data:
    internal: true

volumes:
  postgres-data: {}
  kafka-data: {}

