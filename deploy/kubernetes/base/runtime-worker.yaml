apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-worker
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: runtime-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: runtime-worker, hhc.io/plane: data}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app.kubernetes.io/name: runtime-worker}}
      containers:
        - name: runtime-worker
          image: hhc/runtime-worker:0.1.0-phase0
          imagePullPolicy: Never
          ports: [{name: management, containerPort: 8081}]
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: management}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: management}, periodSeconds: 10}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 128Mi}}]
---
apiVersion: v1
kind: Service
metadata: {name: runtime-worker}
spec:
  selector: {app.kubernetes.io/name: runtime-worker}
  ports: [{name: management, port: 8081, targetPort: management}]

